name: Cron

on:
  schedule:
    - cron:  0 0 * * 1

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        engine:
          - cfengine: "lucee@5"
            java: 11
          - cfengine: "lucee@6"
            java: 11
          - cfengine: "lucee@be"
            java: 21
          - cfengine: "adobe@2021"
            java: 11
          - cfengine: "adobe@2023.0.06"
            java: 17
          - cfengine: "adobe@be"
            java: 21
        coldbox: ["coldbox@6", "coldbox@7", "coldbox@be"]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: yes
          MYSQL_USER: megaphone
          MYSQL_PASSWORD: megaphone
          MYSQL_DATABASE: megaphone
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.engine.java }}

      - name: Set Up CommandBox
        uses: elpete/setup-commandbox@v1.0.0

      - name: Install dependencies
        run: |
          box install
          box config set modules.commandbox-dotenv.checkEnvPreServerStart=false
          box install ${{ matrix.coldbox }} --noSave

      - name: Migrate database
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
        run: |
          box install commandbox-migrations
          box migrate install --verbose
          box migrate up --verbose

      - name: Start server
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
          COLDBOX_VERSION: ${{ matrix.coldbox }}
        run: box server start cfengine=${{ matrix.engine.cfengine }} javaVersion=openjdk${{ matrix.engine.java }}

      - name: Run module activation, provider, inbox and storage regression suites
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
          COLDBOX_VERSION: ${{ matrix.coldbox }}
        run: box testbox run