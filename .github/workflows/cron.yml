name: Cron

on:
  workflow_dispatch:
  schedule:
    - cron:  0 0 * * 1

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Tests (${{ matrix.engine.label || matrix.engine.cfengine }}, ${{ matrix.coldbox }})
    strategy:
      fail-fast: false
      matrix:
        engine:
          - cfengine: "lucee@5"
            java: 11
          - cfengine: "lucee@6"
            java: 11
          - cfengine: "lucee@be"
            java: 21
          - cfengine: "adobe@2021"
            java: 11
          - cfengine: "adobe@2023.0.06"
            java: 17
          - cfengine: "adobe@be"
            java: 21
        coldbox: ["coldbox@6", "coldbox@7", "coldbox@be"]
        include:
          - engine:
              cfengine: "boxlang@1"
              java: 21
              label: "boxlang@1"
              serverConfig: "server-boxlang.json"
            coldbox: "coldbox@8"
          - engine:
              cfengine: "boxlang@1"
              java: 21
              label: "boxlang@1 (CFML compat)"
              serverConfig: "server-boxlang-cfml.json"
            coldbox: "coldbox@8"
          - engine:
              cfengine: "boxlang@be"
              java: 21
              label: "boxlang@be"
              serverConfig: "server-boxlang.json"
            coldbox: "coldbox@be"
          - engine:
              cfengine: "boxlang@be"
              java: 21
              label: "boxlang@be (CFML compat)"
              serverConfig: "server-boxlang-cfml.json"
            coldbox: "coldbox@be"
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: yes
          MYSQL_USER: megaphone
          MYSQL_PASSWORD: megaphone
          MYSQL_DATABASE: megaphone
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.engine.java }}

      - name: Set Up CommandBox
        uses: Ortus-Solutions/setup-commandbox@157ba183d42a6f1abfcbaa4c303072f95837f417 # v2.0.1
        with:
          installSystemModules: false

      - name: Install CommandBox system modules
        run: bash .github/scripts/box-install.sh commandbox-cfconfig,commandbox-dotenv

      - name: Install BoxLang support
        if: startsWith(matrix.engine.cfengine, 'boxlang')
        run: bash .github/scripts/box-install.sh commandbox-boxlang

      - name: Install dependencies
        run: |
          bash .github/scripts/box-install.sh
          box config set modules.commandbox-dotenv.checkEnvPreServerStart=false
          bash .github/scripts/box-install.sh ${{ matrix.coldbox }} --noSave
          if [[ "${{ matrix.engine.cfengine }}" == boxlang* || "${{ matrix.coldbox }}" == "coldbox@be" ]]; then
            bash .github/scripts/box-install.sh testbox@6 --noSave
            bash .github/scripts/box-install.sh qb@14 --noSave
            bash .github/scripts/box-install.sh cbq@7 --noSave
            bash .github/scripts/box-install.sh hyper@8 --noSave
          fi

      - name: Migrate database
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
        run: |
          bash .github/scripts/box-install.sh commandbox-migrations
          box migrate install --verbose
          box migrate up --verbose
          box migrate install manager=cbq --verbose
          box migrate up manager=cbq --verbose

      - name: Start server
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
          COLDBOX_VERSION: ${{ matrix.coldbox }}
        run: |
          if [[ "${{ matrix.engine.cfengine }}" == "lucee@be" ]]; then
            box task run .github/tasks/StartLuceeSnapshot.cfc
          elif [[ -n "${{ matrix.engine.serverConfig }}" ]]; then
            box server start serverConfigFile="${{ matrix.engine.serverConfig }}" cfengine="${{ matrix.engine.cfengine }}" javaVersion=openjdk${{ matrix.engine.java }}_jdk --noSaveSettings
          else
            box server start cfengine=${{ matrix.engine.cfengine }} javaVersion=openjdk${{ matrix.engine.java }}
          fi

      - name: Run module activation, provider, inbox and storage regression suites
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
          COLDBOX_VERSION: ${{ matrix.coldbox }}
        run: box testbox run