name: PRs and Branches

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
  pull_request:
    branches:
      - main
      - master
      - development

jobs:
  release-title:
    name: Validate feature release title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require a scope for feature releases
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          if re.match(r"^feat(?:\(|!?[:])", title, re.IGNORECASE) and not re.match(r"^feat\([^)]+\):\s.+$", title, re.IGNORECASE):
              print("::error::The release parser requires a scoped feature title, such as feat(digests): add named email digests")
              sys.exit(1)
          PY

  tests:
    runs-on: ubuntu-latest
    name: Tests (${{ matrix.engine.label || matrix.engine.cfengine }}, ${{ matrix.coldbox }})
    strategy:
      fail-fast: false
      matrix:
        engine:
          - cfengine: "lucee@5"
            java: 11
          - cfengine: "lucee@6"
            java: 11
          - cfengine: "adobe@2021"
            java: 11
          - cfengine: "adobe@2023.0.06"
            java: 17
        coldbox: ["coldbox@6", "coldbox@7"]
        include:
          - engine:
              cfengine: "boxlang@1"
              java: 21
              label: "boxlang@1"
              serverConfig: "server-boxlang.json"
            coldbox: "coldbox@8"
          - engine:
              cfengine: "boxlang@1"
              java: 21
              label: "boxlang@1 (CFML compat)"
              serverConfig: "server-boxlang-cfml.json"
            coldbox: "coldbox@8"
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: yes
          MYSQL_USER: megaphone
          MYSQL_PASSWORD: megaphone
          MYSQL_DATABASE: megaphone
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.engine.java }}

      - name: Set Up CommandBox
        uses: elpete/setup-commandbox@v1.0.0

      - name: Install BoxLang support
        if: startsWith(matrix.engine.cfengine, 'boxlang')
        run: bash .github/scripts/box-install.sh commandbox-boxlang

      - name: Install dependencies
        run: |
          bash .github/scripts/box-install.sh
          box config set modules.commandbox-dotenv.checkEnvPreServerStart=false
          bash .github/scripts/box-install.sh ${{ matrix.coldbox }} --noSave
          if [[ "${{ matrix.engine.cfengine }}" == boxlang* ]]; then
            bash .github/scripts/box-install.sh testbox@6 --noSave
            bash .github/scripts/box-install.sh qb@14 --noSave
            bash .github/scripts/box-install.sh cbq@7 --noSave
            bash .github/scripts/box-install.sh hyper@8 --noSave
          fi

      - name: Migrate database
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
        run: |
          bash .github/scripts/box-install.sh commandbox-migrations
          box migrate install --verbose
          box migrate up --verbose
          box migrate install manager=cbq --verbose
          box migrate up manager=cbq --verbose

      - name: Start server
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
          COLDBOX_VERSION: ${{ matrix.coldbox }}
        run: |
          if [[ -n "${{ matrix.engine.serverConfig }}" ]]; then
            box server start serverConfigFile="${{ matrix.engine.serverConfig }}" cfengine="${{ matrix.engine.cfengine }}" javaVersion=openjdk${{ matrix.engine.java }}_jdk --noSaveSettings
          else
            box server start cfengine=${{ matrix.engine.cfengine }} javaVersion=openjdk${{ matrix.engine.java }}
          fi

      - name: Run module activation, provider, inbox and storage regression suites
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
          COLDBOX_VERSION: ${{ matrix.coldbox }}
        run: box testbox run

      - name: Verify module activation and optional queue dependency without cbq
        env:
          DB_HOST: localhost
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: megaphone
          DB_USER: megaphone
          DB_PASSWORD: megaphone
          COLDBOX_VERSION: ${{ matrix.coldbox }}
        run: |
          mkdir -p .tmp
          mv modules/cbq .tmp/cbq-optional
          trap 'mv .tmp/cbq-optional modules/cbq' EXIT
          if [[ -n "${{ matrix.engine.serverConfig }}" ]]; then
            box server stop serverConfigFile="${{ matrix.engine.serverConfig }}"
            box server start serverConfigFile="${{ matrix.engine.serverConfig }}" cfengine="${{ matrix.engine.cfengine }}" javaVersion=openjdk${{ matrix.engine.java }}_jdk --noSaveSettings
          fi
          box testbox run bundles=tests.specs.integration.OptionalCBQSpec

  format:
    runs-on: ubuntu-latest
    name: Format
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v1.4.3
        with:
          java-version: 11

      - name: Set Up CommandBox
        uses: elpete/setup-commandbox@v1.0.0

      - name: Install CFFormat
        run: bash .github/scripts/box-install.sh commandbox-cfformat

      - name: Check formatting
        run: box run-script format:check
